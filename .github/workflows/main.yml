name: 'Mirror to GitHub'

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    name: Mirror
    steps:
      - name: Mirror
        id: mirror
        uses: bridgelightcloud/github-mirror-action@v1
        with:
          origin: "https://github.com/google/skia.git"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
