name: 同步上游Skia仓库（Clone & Push）

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆上游并推送到本仓库
        run: |
          git clone --mirror https://github.com/google/skia.git skia-mirror
          cd skia-mirror
          git push --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
