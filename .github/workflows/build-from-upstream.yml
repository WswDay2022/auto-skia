name: Build Skia lib from upstream

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ref: [main, chrome/m150]

    runs-on: ${{ matrix.os }}
    steps:
      - name: 拉取代码 - ${{ matrix.ref }}
        uses: actions/checkout@v5
        with:
          repository: google/skia
          ref: ${{ matrix.ref }}
          submodules: false
         
      - name: 安装系统依赖
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            vcpkg install libpng:x64-windows freetype:x64-windows harfbuzz:x64-windows zlib:x64-windows
          else
            chmod +x tools/install_dependencies.sh
            ./tools/install_dependencies.sh
          fi
        shell: bash

      - name: 设置 Windows 工具链
        if: matrix.os == 'windows-latest'
        run: echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $GITHUB_ENV
        shell: bash

      - name: 安装 depot_tools
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cd C:/
            for i in {1..3}; do
              git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools && break || sleep 5
            done
            echo "C:/depot_tools" >> $GITHUB_PATH
          else
            cd $HOME
            for i in {1..3}; do
              git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools && break || sleep 5
            done
            echo "$HOME/depot_tools" >> $GITHUB_PATH
          fi
        shell: bash

      - name: 同步依赖
        run: python tools/git-sync-deps
        shell: bash

      - name: 生成构建配置（按平台）
        run: |
          common_args=(
            is_debug=false
            is_official_build=true
          )

          if [ "$RUNNER_OS" == "macOS" ]; then
            platform_args=(
              target_os='"mac"'
              skia_use_metal=true
              skia_use_vulkan=false
              skia_use_direct3d=false
            )
          elif [ "$RUNNER_OS" == "Windows" ]; then
            platform_args=(
              target_os='"win"'
              skia_use_direct3d=true
              extra_cflags=["-IC:/vcpkg/installed/x64-windows/include"]
              extra_ldflags=["-LC:/vcpkg/installed/x64-windows/lib"]
              skia_use_vulkan=false
              skia_use_metal=false
            )
          else
            platform_args=(
              target_os='"linux"'
              skia_use_vulkan=true
              skia_use_direct3d=false
              skia_use_metal=false
            )
          fi

          all_args=("${common_args[@]}" "${platform_args[@]}")
          args_string=$(printf " %s" "${all_args[@]}")
          args_string=${args_string:1}
          bin/gn gen out/Release --args="$args_string"
        shell: bash

      - name: 编译
        run: ninja -C out/Release
        shell: bash

      - name: 打包库文件和头文件
        run: |
          mkdir -p skia-package
          cp -r include skia-package/
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp out/Release/skia.lib skia-package/ || true
          else
            cp out/Release/libskia.a skia-package/ || true
          fi
          tar -czf skia-${{ matrix.ref }}-${{ matrix.os }}.tar.gz skia-package/
        shell: bash

      - name: 上传临时编译产物
        uses: actions/upload-artifact@v5
        with:
          name: skia-${{ matrix.ref }}-${{ matrix.os }}
          path: skia-*.tar.gz
          retention-days: 7

      - name: 设置 Release 标签和日期
        id: set_tag
        run: |
          SAFE_REF="${REF//\//-}"
          TAG_NAME="skia-${SAFE_REF}-${{ matrix.os }}-$(date +'%Y%m%d')"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        env:
          REF: ${{ matrix.ref }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_tag.outputs.tag }}
          name: "Skia ${{ matrix.ref }} (${{ matrix.os }}) - ${{ steps.set_tag.outputs.date }}"
          files: skia-*.tar.gz
          generate_release_notes: true
          overwrite: false
